name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [framework-updated]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify sources and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout framework
        uses: actions/checkout@v7
        with:
          repository: csthink/mars-cloud-framework
          path: sources/framework
          fetch-depth: 0
          ref: main
      - name: Checkout service
        uses: actions/checkout@v7
        with:
          repository: csthink/mars-cloud-service
          path: sources/service
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Resolve source commits
        id: sources
        env:
          EVENT_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_REF" = refs/heads/main ]; then mode=main; else mode=candidate; fi
          python3 sources/service/tools/resolve-framework.py \
            --framework sources/framework --mode "$mode" --checkout \
            --output "$RUNNER_TEMP/framework-resolution.json"
      - name: Install Corretto
        id: java
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            sources/framework/**/pom.xml
            sources/service/**/pom.xml

      - name: Install Maven
        id: maven
        run: |
          bash sources/framework/tools/install-maven.sh "$RUNNER_TEMP/maven"
          echo "$RUNNER_TEMP/maven/apache-maven-3.9.14/bin" >> "$GITHUB_PATH"

      - name: Test verification tools
        id: tools
        run: |
          python3 -m unittest discover -s sources/framework/tools/tests -v
          python3 -m unittest discover -s sources/service/tools/tests -v
      - name: Build exact sources
        id: compile
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FRAMEWORK_DIR: ${{ github.workspace }}/sources/framework
          FRAMEWORK_SHA: ${{ steps.sources.outputs.sha }}
          FRAMEWORK_SOURCE: ${{ steps.sources.outputs.source }}
          DECLARED_FRAMEWORK: ${{ steps.sources.outputs.declared }}
        run: |
          bash sources/framework/tools/verify.sh \
            --framework "$FRAMEWORK_DIR" --framework-sha "$FRAMEWORK_SHA" \
            --service "$GITHUB_WORKSPACE/sources/service" \
            --service-sha "$(git -C sources/service rev-parse HEAD)" \
            --framework-source "$FRAMEWORK_SOURCE" --declared-framework "$DECLARED_FRAMEWORK" \
            --purpose service --cache "$HOME/.m2/repository" --output "$RUNNER_TEMP/verification"

      - name: Scan public sources
        id: scan
        run: |
          bash sources/framework/tools/check-public-safety-generic.sh sources/framework
          bash sources/service/tools/check-public-safety-generic.sh sources/service

      - name: Upload verification evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification/
          if-no-files-found: error
          retention-days: 30

      - name: Require every verification step
        if: always()
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          steps = json.loads(os.environ['OUTCOMES'])
          required = ('sources', 'java', 'maven', 'tools', 'compile', 'scan', 'evidence')
          failed = [name for name in required if steps.get(name, {}).get('outcome') != 'success']
          if failed:
              raise SystemExit('Required steps did not succeed: ' + ', '.join(failed))
          PYCODE

  build:
    name: 构建 + 测试 + 安全扫描
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful verification
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
