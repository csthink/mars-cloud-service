spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${MARS_SECURITY_ISSUER_URI:}
          jwk-set-uri: ${MARS_SECURITY_JWK_SET_URI:}
  application:
    name: mars-cloud-upms-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  mvc:
    path-match:
      matching-strategy: ant_path_matcher
  messages:
    basename: i18n/error-code
    encoding: UTF-8

mars:
  security:
    audience: ${spring.application.name}
    authorization:
      enabled: false
  env:
    dev-profiles:
      - local
      - dev
      - test
      - testing
  error-code:
    # 框架层的归属名取自框架内置的权威分配表（FrameworkErrorCodeRange），
    # 这里只列「本服务实际引入了哪些层」，不写死数字。
    framework-layers:
      - common
      - mvc
      - security
    # 业务服务自己的区间。upms-service 的权威区段是 65000–65999，
    # 声明值必须落在该区段内，否则启动期校验直接失败。
    ranges:
      - owner: upms-service
        start: 65000
        end: 65999

server:
  servlet:
    context-path: /upms
  port: 8102

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: "!test"
    import:
      - nacos:shared-common.yaml?group=COMMON&refreshEnabled=true
      - nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE_ID}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE_ID}
        group: DEFAULT_GROUP
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
