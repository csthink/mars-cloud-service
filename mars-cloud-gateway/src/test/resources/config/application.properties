# Offline defaults for route tests. JWT integration tests supply their own issuer.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://127.0.0.1:1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://127.0.0.1:1/keys
# Gateway tests use a controllable Redis substitute; production keeps the Redis health contributor.
management.health.redis.enabled=false
