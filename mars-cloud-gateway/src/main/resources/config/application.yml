spring:
  application:
    name: mars-cloud-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    # 网关是响应式栈。显式写死，避免某个依赖顺带把 Servlet 容器带进 classpath 后
    # Boot 悄悄切成 Servlet 应用——那样网关路由与信封式异常处理都不会生效。
    web-application-type: reactive
  messages:
    basename: i18n/error-code
    encoding: UTF-8
  cloud:
    gateway:
      server:
        webflux:
          # 路由显式声明，不开 discovery.locator：系统外部请求统一经过 gateway，
          # 注册中心里的每个服务不应自动暴露到公网。
          routes:
            # 签发方路径只在过滤器核对认证 Host 后转发；登录页资源限于 /login/**。
            - id: auth-issuer
              uri: lb://mars-cloud-auth-service
              predicates:
                - Path=/oauth2/**,/.well-known/**,/login,/login/**,/logout,/connect/logout,/userinfo
              filters:
                - PreserveHostHeader
            - id: auth-api
              uri: lb://mars-cloud-auth-service
              predicates:
                - Path=/auth/**
            - id: product
              uri: lb://mars-cloud-product-service
              predicates:
                - Path=/product/**
            - id: order
              uri: lb://mars-cloud-order-service
              predicates:
                - Path=/order/**
            - id: notice
              uri: lb://mars-cloud-notice-service
              predicates:
                - Path=/notice/**
            # 既有服务自带对应的 context path，路径原样转发。
            - id: upms
              uri: lb://mars-cloud-upms-service
              predicates:
                - Path=/upms/**
            - id: sample
              uri: lb://mars-cloud-sample-service
              predicates:
                - Path=/sample/**

mars:
  env:
    # 命中时失败响应回带调试详情，语义与业务服务一致；上线前确认生产 profile 不在其中。
    dev-profiles:
      - local
      - dev
      - test
      - testing
  # 网关自产错误的码落在框架分配表的 gateway 段 63000–63999，由 GatewayErrorCode 与其测试守住；
  # 网关不引 Servlet 栈的 mvc starter，因此没有 mars.error-code.* 的启动期校验。

server:
  port: 8100
  # 业务端口的绑定地址。本机缺省回环地址；部署时由环境变量给出实例的私网 IPv4 地址。
  # 管理端口的地址与注册到 Nacos 的地址由可观测性组件与 Nacos 组件从它推导，这里不另写。
  address: ${SERVER_ADDRESS:127.0.0.1}

logging:
  level:
    # 这个过滤器在 DEBUG 级别把转发请求的全部请求头写进日志，其中有 Authorization 里的访问令牌。
    # 固定为 INFO：排查时把网关的包整体调到 DEBUG，访问令牌也不会进日志。
    org.springframework.cloud.gateway.filter.headers.observation: INFO

---
spring:
  config:
    activate:
      on-profile: "!test"
    import:
      - nacos:shared-common.yaml?group=COMMON&refreshEnabled=true
      - nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE_ID}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE_ID}
        group: DEFAULT_GROUP
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}

---
# 测试用文本格式的控制台日志：构建校验器按「级别 类名 消息」的文本形态识别告警，
# 结构化 JSON 行不匹配它的模式，测试里的告警会在构建报告里消失。
# 真实运行仍是结构化 JSON，由可观测性组件的默认值给出。
spring:
  config:
    activate:
      on-profile: "test"
mars:
  observability:
    logging:
      console-format: plain
