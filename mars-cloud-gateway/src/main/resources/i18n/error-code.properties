# 默认档（无 locale 时命中）。三份文件必须同步维护，见框架仓 docs/error-code.md。
# 只放网关自己会产生的码；业务服务的错误响应原样透传，不在这里翻译。
error.code.63001=No route matched the request path
error.code.63002=No available instance for the target service
error.code.63003=Failed to connect to the target service
error.code.63004=The target service did not respond in time
error.code.63006=Too many requests, please try again later

