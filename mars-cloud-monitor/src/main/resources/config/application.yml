spring:
  application:
    name: mars-cloud-monitor
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  thymeleaf:
    # 面板页面的模板在 Spring Boot Admin 的 jar 里，由它自己的模板解析器加载；本模块没有默认的
    # classpath:/templates/ 目录。不关掉这项检查，Spring Boot 每次启动都告警找不到模板目录。
    check-template-location: false

mars:
  env:
    # 命中时视为开发环境，语义与其他部署物一致；上线前确认生产 profile 不在其中。
    dev-profiles:
      - local
      - dev
      - test
      - testing
  monitor:
    admin:
      # 面板管理员账号。两项都不能为空，缺任一启动失败。
      username: ${MONITOR_USERNAME:}
      password: ${MONITOR_PASSWORD:}

server:
  port: 8190
  # 只绑内网地址。本机开发绑回环；部署时由环境变量给出私网地址。
  address: ${SERVER_ADDRESS:127.0.0.1}

---
spring:
  config:
    activate:
      on-profile: "!test"
    import:
      - nacos:shared-common.yaml?group=COMMON&refreshEnabled=true
      - nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE_ID}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE_ID}
        group: DEFAULT_GROUP
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  boot:
    admin:
      # 被监控实例的管理端点需要认证，面板用与服务一致的凭据去读。
      # 不给默认值：读不到实例的管理端点时面板只能显示「离线」，那是比启动失败更难查的故障。
      instance-auth:
        default-user-name: ${MARS_MANAGEMENT_USERNAME}
        default-password: ${MARS_MANAGEMENT_PASSWORD}

---
# 测试用文本格式的控制台日志，理由与其他部署物相同。
spring:
  config:
    activate:
      on-profile: "test"
mars:
  observability:
    logging:
      console-format: plain
