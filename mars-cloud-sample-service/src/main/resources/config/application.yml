spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${MARS_SECURITY_ISSUER_URI:}
          jwk-set-uri: ${MARS_SECURITY_JWK_SET_URI:}
  application:
    name: mars-cloud-sample-service
  profiles:
    # 默认 local：启动前准备 Nacos Namespace 与配置。
    active: ${SPRING_PROFILES_ACTIVE:local}
  messages:
    # 必需：缺这一行，错误文案会退化成裸错误码
    basename: i18n/error-code
    encoding: UTF-8

mars:
  security:
    audience: ${spring.application.name}
  env:
    # 这里列出的 profile 视为开发/测试环境：失败响应会回带调试详情。
    # 生产 profile 不要出现在这个列表里。
    dev-profiles:
      - local
      - dev
      - test
      - testing

  error-code:
    validate: true
    # 用到的框架层。区间数字取自框架内置的权威分配表（FrameworkErrorCodeRange），
    # 这里只列名字，不写死数字。
    framework-layers:
      - common
      - mvc
      - security
    # 本服务自己的那一段。
    # 业务服务共用 business 区段（66000–99999），各自声明一段、互不重叠；
    # 本示例占用 66100–66199，见 docs/services.md 的服务清单。
    ranges:
      - owner: business
        start: 66100
        end: 66199

server:
  port: 8103
  servlet:
    context-path: /sample
  # 业务端口的绑定地址。本机缺省回环地址；部署时由环境变量给出实例的私网 IP 地址。
  # 管理端口的地址与注册到 Nacos 的地址由可观测性组件与 Nacos 组件从它推导，这里不另写。
  address: ${SERVER_ADDRESS:127.0.0.1}

---
spring:
  config:
    activate:
      on-profile: "!test"
    import:
      - nacos:shared-common.yaml?group=COMMON&refreshEnabled=true
      - nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE_ID}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE_ID}
        group: DEFAULT_GROUP
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}

---
# 测试用文本格式的控制台日志：构建校验器按「级别 类名 消息」的文本形态识别告警，
# 结构化 JSON 行不匹配它的模式，测试里的告警会在构建报告里消失。
# 真实运行仍是结构化 JSON，由可观测性组件的默认值给出。
spring:
  config:
    activate:
      on-profile: "test"
mars:
  observability:
    logging:
      console-format: plain
